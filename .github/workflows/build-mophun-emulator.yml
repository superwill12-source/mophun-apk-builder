name: Build and publish AbyssME APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout AbyssME source
        uses: actions/checkout@v4
        with:
          repository: EriArk/JavaEmulator
          ref: main
          path: abyssme

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: abyssme/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || {
            echo "Falha ao aceitar as licenças do Android SDK."
            exit 1
          }

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if sdkmanager --install \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              "ndk;22.1.7171670"; then
              exit 0
            fi

            echo "Instalação falhou na tentativa ${attempt}."
            sleep 10
          done

          echo "Não foi possível instalar os componentes do Android SDK."
          exit 1

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/22.1.7171670"
          echo "Android SDK verificado."

      - name: Check available Gradle tasks
        working-directory: abyssme
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:tasks --all

      - name: Build AbyssME APKs
        working-directory: abyssme
        run: |
          ./gradlew --no-daemon \
            :app:assembleFdroidDebug \
            :app:assemblePhoneDebug

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-apks

          find abyssme/app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -exec cp '{}' release-apks/ ';'

          if ! find release-apks -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "Nenhum APK foi gerado."
            exit 1
          fi

          echo "APKs gerados:"
          ls -lh release-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AbyssME-Mophun-APKs
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "AbyssME Mophun ${{ github.ref_name }}"
          generate_release_notes: true
          files: release-apks/*.apk
          fail_on_unmatched_files: true
