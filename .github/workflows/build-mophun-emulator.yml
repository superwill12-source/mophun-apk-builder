name: Build AbyssME Android APK (Mophun)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-mophun-emulator.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout AbyssME source
        uses: actions/checkout@v4
        with:
          repository: EriArk/JavaEmulator
          ref: main
          path: abyssme

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu images include Android SDK packages.
      # Avoid setup-android/sdkmanager here because sdkmanager failed
      # while computing updates in the previous run.
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/ndk" || true

      - name: Build debug APK with Mophun support
        working-directory: abyssme
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleFdroidDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbyssME-Mophun-Android-APK
          path: abyssme/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
