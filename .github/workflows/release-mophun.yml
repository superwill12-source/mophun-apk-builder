name: Build Wolphun Android with Mophun audio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-wolphun-audio.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build Wolphun Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout Wolphun source
        uses: actions/checkout@v4
        with:
          repository: jamisson2006/wolphun-a-Mophun-emulator
          ref: main
          path: wolphun

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado em $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          result=$?
          set -o pipefail
          if [ "$result" -ne 0 ]; then
            echo "Não foi possível aceitar as licenças do Android SDK."
            exit "$result"
          fi

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;29.0.3" \
            "cmake;3.10.2" \
            "ndk;21.4.7075529"

      - name: Configure compatible NDK
        shell: bash
        working-directory: wolphun/android
        run: |
          set -euo pipefail
          # O projeto declara um NDK r30 RC antigo/incomum no build.gradle.
          # O NDK r21 instalado acima é compatível com o AGP 3.6.4 e compila
          # o pequeno módulo JNI do SoundFont. Removemos somente a versão fixa.
          sed -i "/ndkVersion[[:space:]]*['\"]/d" app/build.gradle
          grep -nE 'compileSdkVersion|buildToolsVersion|externalNativeBuild|ndkVersion' app/build.gradle || true

      - name: Build Wolphun APK
        working-directory: wolphun/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          find wolphun/android/app/build/outputs/apk \
            -type f -name '*.apk' \
            -exec cp '{}' release-files/Wolphun-Mophun-audio.apk \;
          test -s release-files/Wolphun-Mophun-audio.apk
          ls -lh release-files/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wolphun-Mophun-Audio-APK
          path: release-files/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "wolphun-audio-${{ github.run_number }}"
          name: "Wolphun Android — Mophun Audio Build ${{ github.run_number }}"
          body: |
            Build Android do Wolphun, um emulador Mophun independente.

            Esta compilação serve para testar o áudio do Honey Cave 2.
            O Wolphun implementa reprodução MIDI e PCM/ADPCM, mas o áudio
            correto de cada jogo ainda precisa ser confirmado no dispositivo.

            Origem: https://github.com/jamisson2006/wolphun-a-Mophun-emulator
          draft: false
          prerelease: false
          files: release-files/*.apk
          fail_on_unmatched_files: true
