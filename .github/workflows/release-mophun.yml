name: Build and publish AbyssME APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout AbyssME source
        uses: actions/checkout@v4
        with:
          repository: EriArk/JavaEmulator
          ref: main
          path: abyssme

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: abyssme/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Erro: sdkmanager não encontrado."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDK manager encontrado."

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if sdkmanager --sdk_root="$ANDROID_HOME" --install \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              "ndk;22.1.7171670"; then
              exit 0
            fi

            echo "Tentativa $attempt falhou. Tentando novamente..."
            sleep 15
          done

          echo "Erro ao instalar os componentes do Android SDK."
          exit 1

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          result=$?
          set -o pipefail

          if [ "$result" -ne 0 ]; then
            echo "Erro ao aceitar as licenças do SDK."
            exit "$result"
          fi

      - name: Check Gradle configuration
        working-directory: abyssme
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version

      - name: Compile Android APK
        working-directory: abyssme
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            :app:assembleFdroidDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-files

          find abyssme/app/build/outputs/apk \
            -type f -name '*.apk' \
            -exec cp '{}' release-files/ ';'

          if ! find release-files -maxdepth 1 \
            -type f -name '*.apk' | grep -q .; then
            echo "Erro: nenhum APK foi gerado."
            exit 1
          fi

          echo "APK gerado:"
          ls -lh release-files/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbyssME-Mophun-APK
          path: release-files/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "AbyssME Mophun ${{ github.ref_name }}"
          generate_release_notes: true
          files: release-files/*.apk
          fail_on_unmatched_files: true
