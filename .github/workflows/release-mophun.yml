name: Build and publish AbyssME APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout AbyssME source
        uses: actions/checkout@v4
        with:
          repository: EriArk/JavaEmulator
          ref: main
          path: abyssme

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: abyssme/gradle/wrapper/gradle-wrapper.properties

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK não encontrado: $ANDROID_HOME"
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          result=$?
          set -o pipefail

          if [ "$result" -ne 0 ]; then
            echo "Falha ao aceitar as licenças do SDK."
            exit "$result"
          fi

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if sdkmanager --sdk_root="$ANDROID_HOME" --install \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              "ndk;22.1.7171670"; then
              exit 0
            fi

            echo "Tentativa $attempt falhou. Tentando novamente..."
            sleep 15
          done

          echo "Falha ao instalar componentes do Android SDK."
          exit 1

      - name: Build AbyssME APK
        working-directory: abyssme
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleFdroidDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-files

          find abyssme/app/build/outputs/apk \
            -type f -name '*.apk' \
            -exec cp '{}' release-files/ ';'

          if ! find release-files -maxdepth 1 \
            -type f -name '*.apk' | grep -q .; then
            echo "Nenhum APK foi gerado."
            exit 1
          fi

          echo "APKs gerados:"
          ls -lh release-files/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbyssME-Mophun-APK
          path: release-files/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "AbyssME Mophun Build ${{ github.run_number }}"
          body: |
            APK do emulador AbyssME com suporte experimental a Mophun.

            Instalação:
            1. Baixe o APK anexado a esta Release.
            2. Abra o arquivo no Android.
            3. Se necessário, permita a instalação de aplicativos desta fonte.

            Observação: o suporte a jogos Mophun é experimental.
          draft: false
          prerelease: false
          files: release-files/*.apk
          fail_on_unmatched_files: true
