name: Build and publish AbyssME APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout AbyssME source
        uses: actions/checkout@v4
        with:
          repository: EriArk/JavaEmulator
          ref: main
          path: abyssme

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: abyssme/gradle/wrapper/gradle-wrapper.properties

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -e
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não foi encontrado em $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "SDK encontrado: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          result=$?
          set -o pipefail
          if [ "$result" -ne 0 ]; then
            echo "Não foi possível aceitar as licenças do SDK."
            exit "$result"
          fi

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager --sdk_root="$ANDROID_HOME" --install \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              "ndk;22.1.7171670"; then
              exit 0
            fi
            echo "Tentativa ${attempt} falhou; nova tentativa em 15 segundos."
            sleep 15
          done
          echo "Falha ao instalar os componentes necessários."
          exit 1

      - name: Verify project Gradle configuration
        working-directory: abyssme
        shell: bash
        run: |
          set -e
          echo "Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties
          echo "Versões de SDK exigidas pelo projeto:"
          grep -nE 'COMPILE_SDK|TARGET_SDK|NDK_VERSION|com.android.application' build.gradle

      - name: Compile APK
        working-directory: abyssme
        shell: bash
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleFdroidDebug

      - name: Prepare APK for download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          find abyssme/app/build/outputs/apk -type f -name '*.apk' -exec cp '{}' release-files/ ';'
          if ! find release-files -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "A compilação terminou, mas nenhum APK foi encontrado."
            exit 1
          fi
          ls -lh release-files/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbyssME-Mophun-APK
          path: release-files/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "AbyssME Mophun ${{ github.ref_name }}"
          generate_release_notes: true
          files: release-files/*.apk
          fail_on_unmatched_files: true
